// ===== 存储层 =====
function loadState() { try { const raw = localStorage.getItem(MODULE.storageKey); if (!raw) return {}; const p = JSON.parse(raw); return (p && typeof p === 'object') ? p : {}; } catch (e) { console.warn('loadState failed:', e); return {}; } }
function saveState(state) { try { localStorage.setItem(MODULE.storageKey, JSON.stringify(state)); } catch (e) { alert('保存失败'); } }
function getCpState(cpId) { const s = loadState(); if (s[cpId]) return s[cpId]; return ROUND2_DEFAULTS[cpId] || { status: 'pending', bugDesc: '', updatedAt: null }; }
function setCpState(cpId, data) { const s = loadState(); s[cpId] = { ...s[cpId], ...data, updatedAt: new Date().toISOString() }; saveState(s); }
function clearCpState(cpId) { const s = loadState(); delete s[cpId]; saveState(s); }

// ===== 渲染层 =====
const STATUS = { pending: { icon: '⏳', label: '待测' }, pass: { icon: '✅', label: '通过' }, fail: { icon: '❌', label: 'Bug' }, skip: { icon: '⏸', label: '跳过' } };
const R1_BADGE = { pass: 'round-badge--pass', fail: 'round-badge--fail', skip: 'round-badge--skip', pending: 'round-badge--pending' };

function caseStats(tc) { const s = { pass: 0, fail: 0, skip: 0, pending: 0 }; tc.checkpoints.forEach(cp => { const st = getCpState(cp.id).status; s[st] = (s[st] || 0) + 1; }); return s; }

function renderCheckpoint(cp) {
  const st = getCpState(cp.id);
  const failClass = st.status === 'fail' ? 'is-fail' : '';
  const showBug = st.status === 'fail' || st.status === 'skip';
  const bugHidden = showBug ? '' : 'hidden';
  const bugPh = st.status === 'skip' ? '跳过原因 / 备注...' : 'Bug 描述：复现步骤、实际结果、严重程度...';
  return `<div class="cp-row ${failClass}" data-cp-id="${cp.id}"><div class="cp-top"><span class="cp-id">${cp.id}</span><div class="cp-main"><div class="cp-desc">${cp.desc}</div><div class="cp-expected"><strong>预期:</strong> ${cp.expected}</div></div><div class="cp-actions"><button class="cp-btn pass ${st.status === 'pass' ? 'active' : ''}" onclick="setCp('${cp.id}','pass')">✅</button><button class="cp-btn fail ${st.status === 'fail' ? 'active' : ''}" onclick="setCp('${cp.id}','fail')">❌</button><button class="cp-btn skip ${st.status === 'skip' ? 'active' : ''}" onclick="setCp('${cp.id}','skip')">⏸</button><button class="cp-btn reset" onclick="resetCp('${cp.id}')">↺</button></div></div><textarea class="cp-bug ${bugHidden}" placeholder="${bugPh}" onblur="saveBug('${cp.id}', this.value)">${st.bugDesc || ''}</textarea></div>`;
}

function renderCase(tc) {
  const r1 = ROUND1[tc.id] || { status: 'pending', bugDesc: '' };
  const r1cfg = STATUS[r1.status] || STATUS.pending;
  const fixNote = FIX_NOTES[tc.id];
  const stats = caseStats(tc);
  const stepsHtml = tc.steps.map(s => `<li>${s}</li>`).join('');
  const cpsHtml = tc.checkpoints.map(renderCheckpoint).join('');
  return `<div class="case-card" data-case-id="${tc.id}"><div class="case-header has-body" onclick="toggleCase(this)"><span class="case-id">${tc.id}</span><span class="case-title">${tc.title}</span><span class="driver-badge ${tc.driver}">${tc.driver === 'weapp' ? '小程序' : tc.driver === 'playwright' ? 'Playwright' : '手动'}</span><span class="case-stats"><span class="case-stat pass">✅${stats.pass}</span><span class="case-stat fail">❌${stats.fail}</span><span class="case-stat skip">⏸${stats.skip}</span><span class="case-stat pending">⏳${stats.pending}</span></span><span class="case-toggle">▼</span></div><div class="case-body"><div class="case-meta"><div class="meta-row"><span class="meta-label">操作步骤:</span></div><ol class="meta-steps">${stepsHtml}</ol><div class="meta-row"><span class="meta-label">预期:</span><span class="meta-expected">${tc.expected}</span></div><div class="meta-row"><span class="meta-label">一轮:</span>${r1cfg.icon} ${r1cfg.label}<span class="round-badge ${R1_BADGE[r1.status]}">${r1.bugDesc || ''}</span></div>${fixNote ? `<div class="meta-row fix-note">🔧 修复: ${fixNote}</div>` : ''}</div><div class="checkpoints">${cpsHtml}</div></div></div>`;
}

function renderAll() { document.getElementById('cases-container').innerHTML = TEST_CASES.map(renderCase).join(''); updateStats(); }

function updateStats() {
  const s = { pass: 0, fail: 0, skip: 0, pending: 0 };
  TEST_CASES.forEach(tc => { const cs = caseStats(tc); Object.keys(s).forEach(k => { s[k] += cs[k]; }); });
  const total = TEST_CASES.reduce((n, tc) => n + tc.checkpoints.length, 0);
  const done = s.pass + s.fail + s.skip;
  const rate = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('stat-pass').textContent = s.pass;
  document.getElementById('stat-fail').textContent = s.fail;
  document.getElementById('stat-skip').textContent = s.skip;
  document.getElementById('stat-pending').textContent = s.pending;
  document.getElementById('stat-rate').textContent = rate + '%';
  const fill = document.getElementById('progress-fill');
  fill.style.width = rate + '%'; fill.textContent = rate + '%';
  fill.style.background = rate === 100 ? 'var(--success)' : 'var(--primary)';
  TEST_CASES.forEach(tc => { const card = document.querySelector(`.case-card[data-case-id="${tc.id}"]`); if (!card) return; const stats = caseStats(tc); const el = card.querySelector('.case-stats'); if (el) { el.innerHTML = `<span class="case-stat pass">✅${stats.pass}</span><span class="case-stat fail">❌${stats.fail}</span><span class="case-stat skip">⏸${stats.skip}</span><span class="case-stat pending">⏳${stats.pending}</span>`; } });
}

function setCp(cpId, status) { setCpState(cpId, { status }); rerenderCaseByCp(cpId); updateStats(); }
function saveBug(cpId, desc) { const cur = getCpState(cpId); if (cur.bugDesc !== desc) setCpState(cpId, { bugDesc: desc }); }
function resetCp(cpId) { clearCpState(cpId); rerenderCaseByCp(cpId); updateStats(); }
function rerenderCaseByCp(cpId) { const tc = TEST_CASES.find(t => t.checkpoints.some(c => c.id === cpId)); if (!tc) return; const card = document.querySelector(`.case-card[data-case-id="${tc.id}"]`); if (!card) return; const c = card.querySelector('.checkpoints'); if (c) c.innerHTML = tc.checkpoints.map(renderCheckpoint).join(''); }
function toggleCase(h) { const b = h.nextElementSibling; h.classList.toggle('collapsed'); b.classList.toggle('collapsed'); }

function exportModule() {
  const s = { pass: 0, fail: 0, skip: 0, pending: 0 };
  TEST_CASES.forEach(tc => { const cs = caseStats(tc); Object.keys(s).forEach(k => { s[k] += cs[k]; }); });
  const total = s.pass + s.fail + s.skip + s.pending;
  let out = `# ${MODULE.icon} ${MODULE.label} - Bug 清单\n\n导出时间: ${new Date().toLocaleString('zh-CN')}\n检查点统计: ✅ ${s.pass} / ❌ ${s.fail} / ⏸ ${s.skip} / ⏳ ${s.pending} （共 ${total}）\n${'='.repeat(60)}\n\n`;
  const failedCps = [];
  TEST_CASES.forEach(tc => { tc.checkpoints.forEach(cp => { if (getCpState(cp.id).status === 'fail') failedCps.push({ tc, cp }); }); });
  if (failedCps.length === 0) {
    out += `🎉 本模块暂无 Bug\n\n`;
    const r1Open = TEST_CASES.filter(t => ROUND1[t.id]?.status === 'fail');
    if (r1Open.length > 0) { out += `⚠️ 一轮遗留（case 级，待二轮复测）:\n`; r1Open.forEach(t => { out += `  - [${t.id}] ${t.title}: ${ROUND1[t.id].bugDesc}\n`; if (FIX_NOTES[t.id]) out += `      ${FIX_NOTES[t.id]}\n`; }); }
  } else {
    out += `## Bug 清单（检查点级，共 ${failedCps.length} 条）\n\n`;
    failedCps.forEach((item, i) => { const { tc, cp } = item; const st = getCpState(cp.id); out += `### Bug ${i + 1}: [${cp.id}] ${cp.desc}\n所属用例: [${tc.id}] ${tc.title} (${tc.driver})\n预期: ${cp.expected}\n状态: ❌ Bug\n${st.bugDesc ? `Bug 描述: ${st.bugDesc}\n` : ''}更新时间: ${st.updatedAt || '-'}\n\n`; });
  }
  showExport(out);
}

function resetAll() { if (!confirm('确定清空本模块用户标记的检查点记录吗？')) return; localStorage.removeItem(MODULE.storageKey); renderAll(); showExport('✅ 已清空，全部重置为待测。'); }
function showExport(text) { const pre = document.getElementById('export-output'); pre.textContent = text; pre.classList.add('visible'); document.getElementById('export-toolbar').style.display = 'flex'; document.getElementById('copy-hint').style.display = 'block'; pre.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
function copyToClipboard() { const text = document.getElementById('export-output').textContent; if (!text) return; const btn = document.querySelector('.btn-copy'); const orig = btn.textContent; const done = () => { btn.textContent = '✅ 已复制'; setTimeout(() => { btn.textContent = orig; }, 2000); }; if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done)); } else { fallbackCopy(text, done); } }
function fallbackCopy(text, done) { const pre = document.getElementById('export-output'); const range = document.createRange(); range.selectNodeContents(pre); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); try { document.execCommand('copy'); done(); } catch (e) { alert('复制失败'); } sel.removeAllRanges(); }

document.addEventListener('DOMContentLoaded', renderAll);
</script>
